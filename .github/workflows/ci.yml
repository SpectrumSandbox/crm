name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build (Next.js + OpenNext Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Seed SQL is in sync with src/lib/seed.ts
        run: |
          npm run db:seed-sql
          git diff --exit-code drizzle/seed.sql

      - name: Next.js build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
