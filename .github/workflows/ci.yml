name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build (Next.js + OpenNext Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Seed SQL is in sync with src/lib/seed.ts
        run: |
          npm run db:seed-sql
          git diff --exit-code drizzle/seed.sql

      - name: Next.js build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build

  screenshots:
    name: Visual smoke test (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build and start
        run: |
          npm run build
          (npx next start -p 3000 > next.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://localhost:3000/deals

      - name: Capture views
        run: BASE_URL=http://localhost:3000 OUT=shots node scripts/ci-screenshots.mjs

      - name: Publish to ci-artifacts branch
        run: |
          cp next.log shots/next.log || true
          cd shots
          git init -q -b ci-artifacts
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts
