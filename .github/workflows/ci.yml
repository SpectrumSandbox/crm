name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build (Next.js + OpenNext Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Compensation policy checks (§10 worked examples + seed consistency)
        run: npm run test:policy

      - name: Seed SQL is in sync with src/lib/seed.ts
        run: |
          npm run db:seed-sql
          git diff --exit-code drizzle/seed.sql

      - name: Next.js build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build

  screenshots:
    name: Visual smoke test (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build and start
        run: |
          npm run build
          (npx next start -p 3000 > next.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://localhost:3000/deals

      - name: Capture views
        run: BASE_URL=http://localhost:3000 OUT=shots node scripts/ci-screenshots.mjs

      - name: Publish to ci-artifacts branch
        run: |
          cp next.log shots/next.log || true
          cd shots
          git init -q -b ci-artifacts
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts

  deploy:
    name: Deploy to Cloudflare (crm.spectrumgroup.id)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping deploy (Workers Builds may deploy instead)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm install --no-audit --no-fund

      - name: Build for Workers
        if: steps.creds.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build

      - name: Apply D1 migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply spectrum-crm --remote

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy

      - name: Smoke test production
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 10
          body=$(curl -fsSL https://crm.spectrumgroup.id/deals)
          if echo "$body" | grep -q "Hello world"; then echo "Still serving the placeholder Worker"; exit 1; fi
          echo "$body" | grep -q "Spectrum CRM" && echo "crm.spectrumgroup.id is serving the app"
          curl -fsS https://crm.spectrumgroup.id/api/health || true
