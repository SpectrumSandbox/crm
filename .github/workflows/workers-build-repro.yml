name: Workers Builds repro

# Mirrors Cloudflare Workers Builds (fresh clone → npm install → `npx wrangler deploy`) as a dry run,
# and publishes the full log to the `ci-logs` branch so build failures can be diagnosed from git.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install + wrangler deploy --dry-run (Workers Builds default)
        run: |
          mkdir -p logs
          {
            echo "### node $(node -v) npm $(npm -v)"
            WORKERS_CI=1 npm install --no-audit --no-fund 2>&1 | tail -60
            echo "### npx wrangler deploy --dry-run"
            npx wrangler deploy --dry-run --outdir /tmp/wrangler-out 2>&1; ls -la .open-next | head
            echo "### exit: $?"
          } > logs/node${{ matrix.node }}.log 2>&1 || true
          tail -60 logs/node${{ matrix.node }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: logs-node${{ matrix.node }}
          path: logs

  publish:
    runs-on: ubuntu-latest
    needs: repro
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: logs
          merge-multiple: true
      - name: Push logs to ci-logs branch
        run: |
          cd logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Workers Builds repro for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
